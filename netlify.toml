[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Declared explicitly so the build always gets a runtime that supports the
# installed Next.js major version, instead of whatever the site was pinned to
# when it was first created.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# End-to-end tests run in GitHub Actions (.github/workflows/ci.yml).
# The netlify-plugin-cypress post-build step was removed: it serves the site on
# port 8888 during the build, which conflicts with the app's own port 3000 and
# made every deploy depend on a local test run.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
